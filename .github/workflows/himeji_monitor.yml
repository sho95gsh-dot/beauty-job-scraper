name: Himeji Excel Importer

# 実行タイミング：手動実行のみ
on:
  workflow_dispatch: 

jobs:
  run-himeji-importer:
    runs-on: ubuntu-latest

    steps:
      # 1. リポジトリのファイル一式（himeji.xlsx 含む）を読み込む
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Pythonの準備
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. 必要なライブラリのインストール
      - name: Install dependencies
        run: |
          pip install pandas openpyxl gspread google-auth

      # 4. GCPキーの生成（スプレッドシート書き込み権限）
      - name: Create credentials file
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          echo "$GCP_SA_KEY" > service_account.json

      # 5. インポートスクリプトの実行
      - name: Run Import Script
        run: |
          python himeji_monitor.py
